[package]
name = "flowlog-runtime"
# The runtime releases on its own cadence. Generated code depends on it
# by published version, so any additive change ships as an independent bump.
version = "0.7.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Runtime support crate for FlowLog — re-exports timely/differential-dataflow and provides helpers used by flowlog-build-generated code."
readme = "README.md"
keywords = ["datalog", "dataflow", "differential", "timely"]
categories = ["database", "compilers"]

[features]
cli = ["dep:clap"]
shell = ["dep:rustyline"]
sqlite = ["dep:rusqlite"]

[dependencies]
boxcar.workspace = true
clap = { workspace = true, features = ["derive", "string"], optional = true }
dashmap.workspace = true
differential-dataflow.workspace = true
itoa = "1.0"
ordered-float = { workspace = true, features = ["serde"] }
rayon = "1.0"
regex.workspace = true
rusqlite = { version = "0.43", features = ["bundled"], optional = true }
rustc-hash.workspace = true
# History stays in memory, so persistent history support is unnecessary.
rustyline = { version = "19", default-features = false, optional = true }
serde = { workspace = true }
tempfile.workspace = true
thiserror.workspace = true
timely.workspace = true

[dev-dependencies]
# By path alone: Cargo drops a dev-dependency without a version from the
# published manifest, so the runtime publishes before, and without, the
# `flowlog-common` release its tests read `MAX_ROW_WIDTH` from.
flowlog-common = { path = "../flowlog-common" }
rstest.workspace = true

[lints]
workspace = true
