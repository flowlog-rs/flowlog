[package]
name = "flowlog-runtime"
# The runtime releases on its own cadence. Generated code depends on it
# by published version, so any additive change ships as an independent bump.
version = "0.6.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Runtime support crate for FlowLog: re-exports timely/differential-dataflow and provides helpers for code generated by flowlog-build and flowlog-compiler."
readme = "README.md"
keywords = ["datalog", "dataflow", "differential", "timely"]
categories = ["database", "compilers"]

[features]
cli = ["dep:clap"]
shell = ["dep:rustyline"]
sqlite = ["dep:rusqlite"]

[dependencies]
boxcar.workspace = true
clap = { workspace = true, features = ["derive", "string"], optional = true }
dashmap.workspace = true
differential-dataflow.workspace = true
itoa = "1.0"
ordered-float = { workspace = true, features = ["serde"] }
rayon = "1.0"
regex.workspace = true
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
rustc-hash.workspace = true
# History stays in memory, so persistent history support is unnecessary.
rustyline = { version = "19", default-features = false, optional = true }
serde = { workspace = true }
tempfile.workspace = true
thiserror.workspace = true
timely.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
