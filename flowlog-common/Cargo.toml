[package]
name = "flowlog-common"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared support crate for FlowLog."
readme = "README.md"
keywords = ["datalog", "dataflow", "compiler"]
categories = ["compilers", "database"]

[features]
# Derive clap's `ValueEnum` on `ExecutionMode` for CLI front-ends.
# Off by default: library consumers stay clap-free.
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
