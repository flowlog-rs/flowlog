name: Profiler

# Every fixture compiled with `-P`, run, and its profile read back against
# the plan (`tests/fixtures/run.sh --profile`). The profiler predicts each
# plan node's timely operator addresses; a dependency bump or codegen change
# that shifts them fails here instead of misattributing metrics. Not a PR
# gate: it runs on PRs that touch a crate that shapes operators or reads
# profiles, and weekly for upstream patch releases.

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.lock
      - flowlog-codegen/**
      - flowlog-compiler/**
      - flowlog-planner/**
      - flowlog-profiler/**
      - flowlog-runtime/**
      - flowlog-visualizer/**
      - tests/fixtures/**
      - .github/workflows/profiler.yml
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  profiled-fixtures:
    name: 🔬 Profiled fixtures ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Install protobuf-compiler + bsdmainutils
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler bsdmainutils

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 🔬 Profiled fixtures
        run: |
          bash tests/fixtures/run.sh -m compiler --profile -j 4 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # As in CI's e2e shards: the workers' caches are built with the
      # generated crates' flags, so the workspace cache cannot reuse them.
      - name: 🧹 Drop fixture worker caches
        if: always()
        run: rm -rf target/e2e
