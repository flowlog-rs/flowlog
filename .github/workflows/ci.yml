name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Run the required checks against the merge queue's temporary branch too;
  # without this the queue never receives their status and stalls.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  clippy:
    name: 📎 Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 📎 Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: 🧪 Unit + integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 📦 Install nextest
        uses: taiki-e/install-action@nextest

      - name: 🧪 Unit + integration tests
        run: cargo nextest run --workspace --all-features --profile ci

  doctest:
    name: 📖 Doctests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 📖 Doctests
        run: cargo test --doc --workspace --all-features

  doc:
    name: 📚 rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      # docs.rs builds the published crates with default features; the
      # second run also covers the feature-gated sqlite, shell and cli code.
      - name: 📚 rustdoc (default features)
        run: cargo doc --workspace --no-deps

      - name: 📚 rustdoc (all features)
        run: cargo doc --workspace --no-deps --all-features

  # End-to-end fixtures, split across runners. Tune the count via the matrix length.
  fixtures-shard:
    name: 🏁 e2e shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Install bsdmainutils
        run: sudo apt-get update && sudo apt-get install -y bsdmainutils

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 🏁 End-to-end fixtures
        run: |
          bash tests/fixtures/run.sh -j 4 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: 🔬 Profiled compiler fixtures
        run: |
          bash tests/fixtures/run.sh -m compiler --profile -j 4 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # The workers' Cargo caches are built with the generated crates' flags,
      # so the workspace cache cannot reuse them; keep them out of it.
      - name: 🧹 Drop fixture worker caches
        if: always()
        run: rm -rf target/e2e

  # Random transcripts over programs that mix static, append and mutable
  # inputs; every epoch must match a batch recompute (tests/README.md).
  epochs:
    name: 🔁 Every-epoch oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 🔁 Every-epoch oracle
        run: python3 tests/epochs/run.py -j 4

      # Each failed run is kept laid out as a fixture; see tests/README.md.
      - name: 📤 Upload failed runs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: epoch-oracle-failures
          path: target/epochs/failures
          if-no-files-found: ignore

      # The slots, too, are built with the generated crates' flags; keep
      # them out of the workspace cache.
      - name: 🧹 Drop oracle slots
        if: always()
        run: rm -rf target/epochs

  # Required check "🏁 End-to-end fixtures": keeps a stable name; green only if
  # every shard and the every-epoch oracle passed.
  fixtures:
    name: 🏁 End-to-end fixtures
    needs: [fixtures-shard, epochs]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          [ "${{ needs.fixtures-shard.result }}" = success ] || { echo "a fixture shard failed"; exit 1; }
          [ "${{ needs.epochs.result }}" = success ] || { echo "the every-epoch oracle failed"; exit 1; }

  fmt:
    name: 🎨 rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Nightly: rustfmt.toml uses group_imports / imports_granularity,
      # which are nightly-only options.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  deny:
    name: 🛡️ cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  shear:
    name: ✂️ cargo-shear (unused dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: 📦 Install cargo-shear
        uses: taiki-e/install-action@cargo-shear
      # --deny-warnings: an unused optional dependency, or a .rs file that
      # no module declares, is otherwise only a warning.
      - name: ✂️ cargo shear
        run: cargo shear --deny-warnings

  typos:
    name: 📝 typos (spell check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.2

  lint-toml:
    name: 🧹 taplo (TOML format + lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: ⬇️ Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            | gunzip | sudo tee /usr/local/bin/taplo > /dev/null
          sudo chmod +x /usr/local/bin/taplo
          taplo --version
      - name: 🎨 taplo fmt --check
        run: taplo fmt --check --diff
      - name: 🔍 taplo lint
        run: taplo lint
