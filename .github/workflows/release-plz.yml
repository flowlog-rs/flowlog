name: release-plz

# Two-branch release flow:
#   push to main-next → release-pr: opens/updates the rolling "chore: release"
#   PR against main-next (version bumps + changelogs computed from conventional
#   commits since the last crates.io release). Merging it, then merging
#   main-next into main, is the release act.
#   push to main → release: publishes flowlog-runtime / flowlog-build to
#   crates.io in dependency order (waiting for the index between publishes),
#   tags, and creates GitHub Releases. No PR is ever opened from main, so a
#   release merge cannot re-trigger another release PR.
#
# flowlog-compiler is publish=false; release-compiler.yml still handles its
# tag + cross-platform binary uploads.

on:
  push:
    branches: [main, main-next]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz-pr:
    name: Open / update Release PR
    if: github.ref == 'refs/heads/main-next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🤖 release-plz (release-pr)
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          # Must be a PAT (or GitHub App token), not GITHUB_TOKEN, so that
          # the release PR triggers downstream CI (ci.yml) on its own pushes.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: ✍️ Sign off the release commit (DCO)
        # release-plz has no sign-off option, and the DCO check requires a
        # Signed-off-by matching the commit author. Amend one in on the
        # author's behalf, using the commit's own author identity so the
        # sign-off matches. Guarded so a rerun does not re-amend.
        if: steps.release-plz.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          branch='${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' | grep -q .; then
            echo "Release commit already signed off."; exit 0
          fi
          git config user.name  "$(git show -s --format='%an')"
          git config user.email "$(git show -s --format='%ae')"
          git commit --amend --signoff --no-edit
          git push --force-with-lease origin "HEAD:$branch"
          echo "Signed off the release commit on $branch."

  release-plz-release:
    name: Publish on release merge to main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 🚀 release-plz (release)
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
