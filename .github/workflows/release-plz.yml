name: release-plz

# The development and release process is documented in docs/dev/releases.md.

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙️ Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check compiler runtime requirement
        run: python3 .github/scripts/sync-compiler-runtime.py --check

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 🚀 release-plz (release)
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          # Releases created with this PAT trigger the compiler asset workflow.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  prepare:
    name: Open / update Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Serialize PR updates without delaying or skipping release jobs.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙️ Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🤖 release-plz (release-pr)
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          # The PAT lets pushes to the release PR trigger its CI checks.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Finalize compiler dependency and DCO sign-off
        # The generated dependency is outside Cargo's dependency graph, so
        # synchronize it after release-plz has chosen the runtime version.
        # Amend with the release commit's identity to keep its DCO valid.
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: |
          set -euo pipefail
          branch="$RELEASE_BRANCH"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          python3 .github/scripts/sync-compiler-runtime.py
          git add flowlog-compiler/src/scaffold.rs
          if git diff --cached --quiet &&
            git show -s --format='%(trailers:key=Signed-off-by,valueonly)' | grep -q .; then
            echo "Release commit already synchronized and signed off."; exit 0
          fi
          git config user.name  "$(git show -s --format='%an')"
          git config user.email "$(git show -s --format='%ae')"
          git commit --amend --signoff --no-edit
          git push --force-with-lease origin "HEAD:$branch"
          echo "Finalized the release commit on $branch."
