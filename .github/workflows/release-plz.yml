name: release-plz

# The development and release process is documented in docs/dev/releases.md.

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz-release:
    name: Publish releases
    runs-on: ubuntu-latest
    outputs:
      release_compiler: ${{ steps.compiler.outputs.result }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙️ Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: 🚀 release-plz (release)
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Select compiler release
        id: compiler
        uses: actions/github-script@v9
        with:
          # Mirror release_always=false for the compiler, including releases
          # that only change its version and publish no library crates.
          script: |
            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha },
            );
            return prs.some(pr =>
              pr.merged_at !== null &&
              pr.base.ref === 'main' &&
              pr.head.ref.startsWith('release-plz-') &&
              pr.merge_commit_sha === context.sha
            );

  release-compiler:
    needs: release-plz-release
    if: needs.release-plz-release.outputs.release_compiler == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-compiler.yml

  release-plz-pr:
    name: Open / update Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Serialize PR updates without delaying or skipping release jobs.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⚙️ Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🤖 release-plz (release-pr)
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          # The PAT lets pushes to the release PR trigger its CI checks.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: ✍️ Sign off the release commit (DCO)
        # release-plz has no sign-off option, and the DCO check requires a
        # Signed-off-by matching the commit author. Amend one in on the
        # author's behalf, using the commit's own author identity so the
        # sign-off matches. Guarded so a rerun does not re-amend.
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: |
          set -euo pipefail
          branch="$RELEASE_BRANCH"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' | grep -q .; then
            echo "Release commit already signed off."; exit 0
          fi
          git config user.name  "$(git show -s --format='%an')"
          git config user.email "$(git show -s --format='%ae')"
          git commit --amend --signoff --no-edit
          git push --force-with-lease origin "HEAD:$branch"
          echo "Signed off the release commit on $branch."
