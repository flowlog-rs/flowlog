name: Compiler release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing compiler release tag to rebuild
        required: true
        type: string

concurrency:
  group: compiler-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'flowlog-compiler-v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build compiler
        run: cargo build --release --locked -p flowlog-compiler --target ${{ matrix.target }}

      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          stage="flowlog-compiler-${RELEASE_TAG#flowlog-compiler-v}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/flowlog-compiler${{ matrix.ext }}" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage/"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          else
            shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
          fi
          echo "ASSET_TARBALL=$stage.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_CHECKSUM=$stage.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$ASSET_TARBALL" "$ASSET_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" --clobber
