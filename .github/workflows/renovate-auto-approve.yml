name: Auto-approve Renovate

on:
  pull_request_target:
    # main dismisses stale approvals, so a Renovate rebase needs a new review.
    types: [opened, reopened, labeled, synchronize]
    branches: [main]

permissions: {}

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Approve
        env:
          # Committer PAT: the ruleset requires a Committers-team approval,
          # which GITHUB_TOKEN cannot provide.
          GH_TOKEN: ${{ secrets.RENOVATE_APPROVE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve
