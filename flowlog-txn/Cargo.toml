[package]
name = "flowlog-txn"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Interactive shell for a compiled FlowLog program: command language and prompt."
readme = "README.md"
keywords = ["datalog", "dataflow", "repl"]
categories = ["command-line-interface", "database"]

[features]
default = ["prompt"]
# The terminal: rustyline and the `prompt` module. Off for library-mode
# hosts, whose generated engine speaks `txn` but never opens a prompt.
prompt = ["dep:rustyline"]

[dependencies]
rustyline = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
