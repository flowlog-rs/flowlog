[workspace]
pr_labels = ["release"]
release_always = false

[[package]]
name = "flowlog-compiler"
# Compiler archives are versioned against their Git tags, not crates.io.
git_only = true
semver_check = false
git_tag_name = "flowlog-compiler-v{{ version }}"
# These libraries change the compiler's behavior and generated programs.
changelog_include = [
    "flowlog-build",
    "flowlog-common",
    "flowlog-parser",
    "flowlog-planner",
    "flowlog-profiler",
    "flowlog-runtime",
]

[[package]]
name = "flowlog-visualizer"
release = false
publish = false
