[package]
name = "flowlog-build"
version = "0.8.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Build-time FlowLog compiler for library mode."
readme = "README.md"
keywords = ["datalog", "dataflow", "compiler", "build-script"]
categories = ["compilers", "database", "development-tools::build-utils"]

[dependencies]
flowlog-codegen.workspace = true
flowlog-common.workspace = true
flowlog-parser.workspace = true
flowlog-planner.workspace = true
flowlog-profiler.workspace = true

codespan-reporting.workspace = true
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
thiserror.workspace = true

[dev-dependencies]
flowlog-parser = { workspace = true, features = ["_test-harness"] }
rstest.workspace = true

[lints]
workspace = true
