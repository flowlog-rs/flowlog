# cargo-mutants configuration.
#
# Mutation testing checks whether the test suite actually *catches* bugs:
# it mutates the code (flip an operator, replace a return value) and reruns
# the tests — a surviving ("MISSED") mutant means nothing tested that line.
#
# Run locally, scoped, to investigate one area:
#   cargo mutants --file "**/typecheck/**"
# CI runs it sharded on a weekly schedule (.github/workflows/mutants.yml).

# Skip flowlog-compiler. It mostly emits the generated program with quote!,
# which the end-to-end fixtures check and cargo-mutants does not run, so its
# mutants would falsely read as MISSED. The parser, planner, codegen, profiler
# and runtime crates hold the logic and unit-test it.
exclude_globs = ["flowlog-compiler/**"]

# Build and test with all features, like CI's unit tests, so mutants in
# feature-gated code (flowlog-runtime's sqlite, shell and cli) are compiled
# and tested instead of reading as MISSED.
all_features = true

# Run each mutant's tests under nextest (parallel, process-per-test), matching
# CI's unit-test runner. Requires cargo-nextest on PATH.
test_tool = "nextest"
